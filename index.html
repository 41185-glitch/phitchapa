<!DOCTYPE html>
<html lang="th">
<head>
<style>
*{
box-sizing:border-box;
margin:0;
padding;0;
}
header{background-image:url(images/header.jpg);height:256px;}
nav{background-color:pink;height:400px;flex:1;}
article{background-color:green;height:400px;flex:4;}
footer{background-color:blue;height:100px;}
section{display:flex;}
.container{width:1024px;margin:0 auto;}
a:link{
color:green;
text-decoration:none;
background-color:#FF2900;
display:block;
width:100%;
padding:10px;
}
a:visited{
color:pink;
}
a:hover{
color:red;
background-color:#C4CBF2;
}
a:active{
color:blue;
}
</style>
<meta charset="utf-8">
<title>work08 html layout</title>
</head>
<body>
<div class="container">
<header></header>
<section>
<nav>

<li><a href="">พีโอนี (Peony)</a></li>
<li><a href="">ไฮเดรนเยีย (Hydrangea)</a></li>
</ul>
</nav>
<article>
</article>
</section>
<footer></footer>
</div>
</body>
</html>
